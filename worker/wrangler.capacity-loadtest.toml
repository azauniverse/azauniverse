name = "aza-universe-capacity-loadtest"
main = "src/index.capacity-loadtest.js"
compatibility_date = "2026-10-01"

[vars]
MAX_ACTIVE = "10000"
HEARTBEAT_MS = "600000"
STALE_MS = "1320000"
ALARM_EVERY_MS = "300000"
ALLOWED_ORIGINS = "https://azauniverse.github.io"

[[durable_objects.bindings]]
name = "SITE_CAPACITY"
class_name = "SiteCapacity"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteCapacity"]
