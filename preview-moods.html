<!doctype html><html lang="ky"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZA AI Robot moods preview</title><style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#122c48,#060d16 65%);font:15px system-ui;color:#eaf6ff}.wrap{width:min(95vw,520px);padding:24px;box-sizing:border-box;text-align:center}.stage{height:230px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #284e6c;border-radius:24px;background:radial-gradient(ellipse at 50% 100%,#0e3d59,#081625 75%)}.orbit{position:absolute;width:240px;height:135px;border:1px solid #47bfff40;border-radius:50%;transform:rotate(-15deg)}.bot{position:relative;width:204px;height:112px;box-sizing:border-box;border:9px solid #267bff;border-radius:999px;background:linear-gradient(#fff,#f3f7ff);box-shadow:0 0 32px #2d83ff72;animation:float 4s ease-in-out infinite}.eye{position:absolute;top:36px;width:13px;height:13px;border-radius:50%;background:#202334}.e1{left:42px}.e2{right:42px}.mouth{position:absolute;left:50%;top:51px;width:24px;height:4px;border-radius:999px;background:#202334;transform:translateX(-50%)}.open,.smile{display:none}.flames{position:absolute;left:50%;top:-40px;transform:translateX(-50%);display:none;gap:3px}.flames i{width:20px;height:40px;background:linear-gradient(#ffe65b,#ff8c22,#ff414d);clip-path:polygon(50% 0,100% 60%,70% 100%,25% 92%,0 57%)}.star{display:none;position:absolute;top:28px;color:#ffad24;font-size:25px}.s1{left:36px}.s2{right:36px}.status{position:absolute;bottom:12px;border-radius:99px;background:#071522df;border:1px solid #2f5b77;padding:6px 12px;font-size:12px}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.buttons button{border:1px solid #2c6584;background:#0d2132;color:#eff9ff;border-radius:10px;padding:10px 12px;font-weight:700}.stage[data-mood="thinking"] .bot{animation:pulse 1.2s ease-in-out infinite}.stage[data-mood="listening"] .bot{border-color:#7c72d9;box-shadow:0 0 30px #8b7dff55;transform:rotate(-2deg)}.stage[data-mood="speaking"] .bot{border-color:#267bff;animation:speak .5s ease-in-out infinite alternate}.stage[data-mood="speaking"] .mouth{display:none}.stage[data-mood="speaking"] .open{display:block;position:absolute;left:50%;top:45px;width:17px;height:14px;border-radius:50%;background:#252839;transform:translateX(-50%);animation:talk .25s infinite alternate}.stage[data-mood="laughing"] .bot{border-color:#f39a26;box-shadow:0 0 36px #ffad2c99}.stage[data-mood="laughing"] .eye{display:none}.stage[data-mood="laughing"] .star{display:block;animation:star 1s infinite alternate}.stage[data-mood="laughing"] .mouth{display:none}.stage[data-mood="laughing"] .smile{display:block;position:absolute;left:50%;top:46px;width:25px;height:12px;border-bottom:5px solid #202334;border-radius:0 0 100% 100%;transform:translateX(-50%)}.stage[data-mood="angry"] .bot{border-color:#ff414f;box-shadow:0 0 38px #ff394f99;animation:speak .5s infinite alternate}.stage[data-mood="angry"] .flames{display:flex}.stage[data-mood="angry"] .eye:before{content:"";position:absolute;top:-5px;left:-2px;width:17px;height:4px;background:#202334;transform:rotate(-12deg)}.stage[data-mood="angry"] .mouth{display:none}.stage[data-mood="angry"] .open{display:block;position:absolute;left:50%;top:45px;width:17px;height:14px;border-radius:50%;background:#252839;transform:translateX(-50%)}@keyframes float{50%{transform:translateY(-3px)}}@keyframes pulse{50%{transform:translateY(-2px) scale(1.015)}}@keyframes speak{to{transform:translateY(-1px) scale(1.012)}}@keyframes talk{to{transform:translateX(-50%) scaleY(.45)}}@keyframes star{to{transform:scale(1.1) rotate(8deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><div class="wrap"><h1>AZA AI — эмоциялар</h1><p>Абалды тандап, роботтун көрүнүшүн алдын ала көр.</p><div class="stage" id="stage" data-mood="thinking"><div class="orbit"></div><div class="bot"><span class="flames"><i></i><i></i><i></i><i></i><i></i></span><i class="eye e1"></i><i class="eye e2"></i><i class="star s1">★</i><i class="star s2">★</i><i class="mouth"></i><i class="open"></i><i class="smile"></i></div><div class="status" id="status">Ойлонуп жатат…</div></div><div class="buttons"><button data-state="thinking">Ойлонуу</button><button data-state="listening">Угуу</button><button data-state="speaking">Сүйлөө</button><button data-state="laughing">Күлүү</button><button data-state="angry">Жалын 🔥</button></div><p>Болжолдуу демо: бул бет AI серверге туташпайт.</p></div><script>const s=document.querySelector('#stage'),t=document.querySelector('#status');const labels={thinking:'AI ойлонуп жатат…',listening:'Угуп жатат…',speaking:'Сүйлөп жатат…',laughing:'Ха-ха, досум! 😂',angry:'Ох, азыр айтып берем! 🔥'};document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{const mood=b.dataset.state;s.dataset.mood=mood;t.textContent=labels[mood]}));</script></html>
