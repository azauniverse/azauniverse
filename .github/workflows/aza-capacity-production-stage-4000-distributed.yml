name: AZA Production Capacity Stage - 4000 Sessions (Distributed Diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aza-websocket-loadtest-exclusive
  cancel-in-progress: false

jobs:
  production-health:
    name: Verify production Worker health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            https://aza-universe-capacity.azataycan2002.workers.dev/health \
            | grep -q '"ok":true'
          echo "Production Worker health check passed."

  # A single canary stops the 4000-session run if Durable Objects is rejecting requests.
  production-canary:
    name: Verify Durable Objects before the 4000-session run
    needs: production-health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Open one temporary WebSocket and verify initial state
        shell: bash
        env:
          WS_URL: wss://aza-universe-capacity.azataycan2002.workers.dev/ws
          ORIGIN: https://azauniverse.github.io
          TARGET_CONNECTIONS: "1"
          RAMP_SECONDS: "30"
          HOLD_SECONDS: "30"
          AGGREGATE_ERRORS: "false"
        run: |
          set -euo pipefail
          echo "Preflight: one temporary production WebSocket."
          echo "The 4000-session shards start only if this check succeeds."
          k6 run tests/aza-capacity-ws-staged-diagnostic-detailed.js

  production-shards:
    name: "Production shard ${{ matrix.shard }} / 8 — 500 sessions"
    needs: production-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run one 500-session production shard and export summary
        shell: bash
        env:
          SHARD_ID: ${{ matrix.shard }}
          WS_URL: wss://aza-universe-capacity.azataycan2002.workers.dev/ws
          ORIGIN: https://azauniverse.github.io
          TARGET_CONNECTIONS: "500"
          RAMP_SECONDS: "300"
          HOLD_SECONDS: "120"
          AGGREGATE_ERRORS: "true"
        run: |
          set +e
          echo "WARNING: opens up to 4000 temporary WebSocket sessions against the PRODUCTION capacity Worker."
          echo "Shard ${SHARD_ID}: 500 sessions; eight shards total 4000 sessions."
          k6 run --summary-export="summary-${SHARD_ID}.json" tests/aza-capacity-ws-staged-diagnostic-detailed.js
          k6_status=$?
          printf '%s\n' "$k6_status" > "k6-exit-${SHARD_ID}.txt"
          echo "Shard ${SHARD_ID} k6 exit code: ${k6_status}; aggregate thresholds decide overall success."
          exit 0

      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ws-summary-${{ matrix.shard }}
          path: |
            summary-${{ matrix.shard }}.json
            k6-exit-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 7

  aggregate-results:
    name: Aggregate all 4000 production sessions
    needs: production-shards
    if: ${{ always() && needs.production-shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download production shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: production-ws-summary-*
          path: summaries
          merge-multiple: true

      - name: Evaluate aggregate 4000-session thresholds
        shell: bash
        run: node tests/aggregate-ws-summaries-4000.mjs summaries 8 500
