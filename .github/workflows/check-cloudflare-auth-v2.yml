name: Diagnose Cloudflare Credentials (fixed Account ID)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '928988bab528346be2682b3cf1866b0f'
    steps:
      - name: Check required values without printing them
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing or empty."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Configured Account ID format is invalid."
            exit 1
          fi
          echo "API token secret is present; Account ID format is valid. Values are not printed."

      - name: Verify account API token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          http_code="$(curl --silent --show-error -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"
          if [[ "$http_code" == "200" ]] && jq -e '.success == true and .result.status == "active"' "$tmp" >/dev/null; then
            echo "Cloudflare Account API token is valid and active. Token value not shown."
            rm -f "$tmp"
          else
            echo "::error::Cloudflare Account API token verification failed (HTTP ${http_code}). Safe response details:"
            jq -r '.errors[]? | "code \(.code): \(.message)"' "$tmp" || true
            rm -f "$tmp"
            exit 1
          fi

      - name: Verify Workers Scripts access
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          http_code="$(curl --silent --show-error -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          if [[ "$http_code" == "200" ]] && jq -e '.success == true' "$tmp" >/dev/null; then
            echo "Account ID resolves and the token can access Workers Scripts."
            rm -f "$tmp"
            exit 0
          fi
          echo "::error::Cloudflare rejected the Account ID / Workers Scripts request (HTTP ${http_code}). Safe details:"
          jq -r '.errors[]? | "code \(.code): \(.message)"' "$tmp" || true
          rm -f "$tmp"
          exit 1
