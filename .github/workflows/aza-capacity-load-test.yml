name: AZA UNIVERSE staged 10k capacity test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aza-universe-capacity-load-test
  cancel-in-progress: false

jobs:
  staged-capacity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Deploy isolated load-test Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.capacity-loadtest.toml
          wranglerVersion: '4'

      - name: Verify isolated Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail \
              https://aza-universe-capacity-loadtest.azataycan2002.workers.dev/health \
              | grep -q '"ok":true'; then
              echo "Load-test Worker health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Load-test Worker health endpoint did not become healthy."
          exit 1

      - name: Run progressive WebSocket and static asset load test
        shell: bash
        env:
          BASE_URL: https://azauniverse.github.io/azauniverse
          WS_URL: wss://aza-universe-capacity-loadtest.azataycan2002.workers.dev/ws
          ORIGIN: https://azauniverse.github.io
        run: |
          set -euo pipefail

          run_stage() {
            local target="$1"
            local ramp="$2"
            local hold="$3"
            echo "::group::Capacity stage: ${target} concurrent sessions (ramp ${ramp}s, hold ${hold}s)"
            TARGET_CONNECTIONS="$target" RAMP_SECONDS="$ramp" HOLD_SECONDS="$hold" \
              k6 run tests/aza-capacity-websocket-load.js
            echo "::endgroup::"
          }

          # Stop at the first stage that misses thresholds. The production
          # Worker is not targeted; only the isolated load-test Worker receives WS traffic.
          run_stage 100 30 30
          run_stage 500 60 30
          run_stage 1000 120 45
          run_stage 2500 180 60
          run_stage 5000 300 60
          run_stage 10000 600 120

          echo "All staged tests passed up to 10,000 concurrent WebSocket sessions."
