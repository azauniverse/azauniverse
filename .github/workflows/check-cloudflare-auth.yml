name: Diagnose Cloudflare Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secret presence and Account ID format
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing or empty."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or is not a 32-character hex Account ID. Do not use Zone ID or Worker name."
            exit 1
          fi
          echo "Both required secrets are present; Account ID format is valid. Values are not printed."

      - name: Verify API token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")" || {
              echo "::error::Cloudflare token verification request failed. The token may be malformed or invalid. Response details:"
              printf '%s' "${response:-}" | jq -r '.errors[]? | "code \(.code): \(.message)"' || true
              exit 1
            }
          if printf '%s' "$response" | jq -e '.success == true and .result.status == "active"' >/dev/null; then
            echo "Cloudflare API token is valid and active. Token value not shown."
          else
            echo "::error::Cloudflare did not report an active API token. Details:"
            printf '%s' "$response" | jq -r '.errors[]? | "code \(.code): \(.message)"'
            exit 1
          fi

      - name: Verify Account ID and Workers Scripts access
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          http_code="$(curl --silent --show-error \
            -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          if [[ "$http_code" == "200" ]] && jq -e '.success == true' "$tmp" >/dev/null; then
            echo "Account ID resolves and token can access Workers Scripts in that account."
            rm -f "$tmp"
            exit 0
          fi
          echo "::error::Cloudflare rejected the Account ID / Workers Scripts request (HTTP ${http_code}). Safe diagnostic details:"
          jq -r '.errors[]? | "code \(.code): \(.message)"' "$tmp" || true
          if jq -e '.errors[]?.code == 7003' "$tmp" >/dev/null 2>&1; then
            echo "::error::Cloudflare returned 7003: verify this Account ID belongs to the exact account where aza-universe-capacity was created."
          elif jq -e '.errors[]?.code == 10000' "$tmp" >/dev/null 2>&1; then
            echo "::error::The token is recognized, but it lacks permission for this account endpoint. Recreate it with the Cloudflare 'Edit Cloudflare Workers' template scoped to the correct account."
          fi
          rm -f "$tmp"
          exit 1
