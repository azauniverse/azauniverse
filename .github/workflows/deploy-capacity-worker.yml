name: Deploy AZA Capacity Worker (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# Use the same exclusive lock as capacity tests and the automatic health-checked deploy.
concurrency:
  group: aza-websocket-loadtest-exclusive
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          wranglerVersion: '4'
