name: AZA UNIVERSE Performance Smoke Test

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose a performance test"
        required: true
        type: choice
        default: static
        options:
          - static
          - question-bank

permissions:
  contents: read

concurrency:
  group: aza-performance-smoke
  cancel-in-progress: false

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Test website static assets
        if: inputs.suite == 'static'
        env:
          BASE_URL: https://azauniverse.github.io/azauniverse
        run: k6 run tests/aza-static-smoke.js

      - name: Test large question bank
        if: inputs.suite == 'question-bank'
        env:
          BASE_URL: https://azauniverse.github.io/azauniverse
        run: k6 run tests/aza-question-bank-smoke.js
